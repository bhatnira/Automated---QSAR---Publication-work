# Configuration file for AutoML QSAR

# Featurization
featurization:
  methods:
    - rdkit
    - ecfp
    - maccs
    - pharmacophore
  
  ecfp:
    radius: 2
    n_bits: 2048
  
  embeddings:
    type: random
    dim: 128

# Preprocessing
preprocessing:
  scaling:
    method: standard  # standard, minmax, robust
  
  feature_selection:
    enabled: true
    method: variance  # variance, correlation, boruta
    threshold: 0.01
  
  dimensionality_reduction:
    enabled: false
    method: pca  # pca, umap
    variance_threshold: 0.95

# Models
models:
  linear:
    - ridge
    - lasso
    - elasticnet
  
  tree:
    - randomforest
    - gradientboosting
    - xgboost
  
  kernel:
    - svr
    - kernelridge
  
  neural:
    - feedforward
    - deep

# Hyperparameter Optimization
optimization:
  method: bayesian  # bayesian, genetic, grid
  n_trials: 100
  timeout: null
  n_jobs: -1

# Cross-Validation
cross_validation:
  strategy: nested  # nested, kfold, loso
  outer_folds: 5
  inner_folds: 3
  shuffle: true

# Ensemble
ensemble:
  method: topk  # topk, voting, stacking
  k: 5
  aggregation: weighted_mean

# Evaluation Metrics
metrics:
  primary: rmse
  secondary:
    - mae
    - r2
    - q2

# General
general:
  random_state: 42
  n_jobs: -1
  verbose: true
  
# Output
output:
  save_models: true
  save_predictions: true
  save_interpretations: true
  output_dir: ./output
