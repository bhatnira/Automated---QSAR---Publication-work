name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================
  # Code Quality Checks
  # ============================================================
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install linting tools
        run: |
          pip install flake8 black isort mypy
          
      - name: Check code formatting (Black)
        run: black --check --diff automl_qsar/ tests/
        continue-on-error: true
        
      - name: Check import sorting (isort)
        run: isort --check-only --diff automl_qsar/ tests/
        continue-on-error: true
        
      - name: Lint with flake8
        run: |
          flake8 automl_qsar/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 automl_qsar/ --count --exit-zero --max-complexity=10 --max-line-length=100 --statistics

  # ============================================================
  # Unit Tests
  # ============================================================
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-xdist
          
      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=automl_qsar --cov-report=xml --cov-report=term-missing
          
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # ============================================================
  # Integration Tests - Data Curation Scenarios
  # ============================================================
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          
      - name: Run integration tests
        run: pytest tests/integration/ -v
        
      - name: Run data curation tests
        run: python test_data_curation.py

  # ============================================================
  # Scenario Tests - Different QSAR Tasks
  # ============================================================
  scenario-tests:
    name: Scenario Tests (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    needs: unit-tests
    strategy:
      matrix:
        scenario:
          - regression_single
          - regression_multi
          - classification_binary
          - classification_multiclass
          - mixed_tasks
          - large_dataset
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          
      - name: Run scenario test
        run: pytest tests/scenarios/test_${{ matrix.scenario }}.py -v

  # ============================================================
  # Full Pipeline Test
  # ============================================================
  pipeline-test:
    name: Full Pipeline Test
    runs-on: ubuntu-latest
    needs: [integration-tests, scenario-tests]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run full pipeline test
        run: python test_quick.py
        
      - name: Run IC50 dataset test
        run: python test_ic50_dataset.py

  # ============================================================
  # Build & Package
  # ============================================================
  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: pipeline-test
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install build tools
        run: pip install build twine
        
      - name: Build package
        run: python -m build
        
      - name: Check package
        run: twine check dist/*
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # ============================================================
  # Documentation
  # ============================================================
  docs:
    name: Build Documentation
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install sphinx sphinx-rtd-theme myst-parser
          
      - name: Build docs
        run: |
          cd docs 2>/dev/null || echo "No docs folder yet"
        continue-on-error: true
